name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version tag (e.g., v3.2.1)'
        required: false
        default: 'v3.2.1'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-and-push.yml'
      - 'VERSION.txt'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Read version from VERSION.txt
        id: version
        run: |
          NCS_VERSION=$(grep NRF_CONNECT_SDK_VERSION VERSION.txt | cut -d'=' -f2)
          echo "ncs_version=${NCS_VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${NCS_VERSION}" >> $GITHUB_OUTPUT
          # Extract major.minor version (e.g., v3.2 from v3.2.1)
          MAJOR_MINOR=$(echo ${NCS_VERSION} | sed -E 's/(v[0-9]+\.[0-9]+).*/\1/')
          echo "major_minor=${MAJOR_MINOR}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.image_tag }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest
            type=sha,prefix=sha-
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        timeout-minutes: 120
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PIP_NO_CACHE_DIR=1
      
      - name: Run image verification
        run: |
          echo "Pulling image for verification..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
          
          echo "Running verification tests..."
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }} /bin/bash -c "
            set -e
            echo '=== Checking West ==='
            west --version
            echo '=== Checking CMake ==='
            cmake --version
            echo '=== Checking Ninja ==='
            ninja --version
            echo '=== Checking Python ==='
            python3 --version
            echo '=== Checking Environment Variables ==='
            echo \"ZEPHYR_BASE: \$ZEPHYR_BASE\"
            echo \"ZEPHYR_SDK_INSTALL_DIR: \$ZEPHYR_SDK_INSTALL_DIR\"
            echo '=== Checking nRF SDK ==='
            ls -la /workdir/nrf/
            echo '=== All checks passed! ==='
          "
      
      - name: Create summary
        run: |
          echo "## Docker Image Built Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.version.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.version.outputs.major_minor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**nRF Connect SDK Version:** ${{ steps.version.outputs.ncs_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
